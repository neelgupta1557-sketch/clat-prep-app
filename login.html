<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">
  <h2>🔐 Login</h2>

  <input type="text" id="username" placeholder="Enter Username"><br><br>

  <!-- 🔥 PASSWORD WITH SVG ICON -->
  <div style="position:relative; width: 100%;">
    <input type="password" id="password" placeholder="Enter Password" style="width:100%; padding-right:40px;">
    
    <span onclick="togglePassword()" 
          style="position:absolute; right:10px; top:10px; cursor:pointer;">

      <!-- 👁️ Open Eye -->
      <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" 
           viewBox="0 0 24 24" stroke="black" width="24" height="24">
        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/>
        <circle cx="12" cy="12" r="3" stroke-width="2"/>
      </svg>

      <!-- 🙈 Closed Eye -->
      <svg id="eyeClose" xmlns="http://www.w3.org/2000/svg" fill="none" 
           viewBox="0 0 24 24" stroke="black" width="24" height="24" style="display:none;">
        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          d="M3 3l18 18M10.58 10.58A3 3 0 0012 15a3 3 0 002.42-4.42M9.88 5.09A9.77 9.77 0 0112 5c7 0 10.5 7 10.5 7a16.88 16.88 0 01-2.39 3.32M6.1 6.1A16.93 16.93 0 001.5 12s3.5 7 10.5 7a9.77 9.77 0 004.12-.91"/>
      </svg>

    </span>
  </div>

  <br>

  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>

  <p id="msg"></p>
</div>

<script>

// 👁️ Toggle password
function togglePassword(){
  let pass = document.getElementById("password");
  let open = document.getElementById("eyeOpen");
  let close = document.getElementById("eyeClose");

  if(pass.type === "password"){
    pass.type = "text";
    open.style.display = "none";
    close.style.display = "block";
  } else {
    pass.type = "password";
    open.style.display = "block";
    close.style.display = "none";
  }
}

// Signup
function signup(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if(user === "" || pass === ""){
    document.getElementById("msg").innerText = "⚠️ Fill all fields!";
    return;
  }

  localStorage.setItem("user", user);
  localStorage.setItem("pass", pass);

  document.getElementById("msg").innerText = "✅ Account Created!";
}
