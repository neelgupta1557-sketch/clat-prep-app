<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  width: 300px;
  color: white;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.login-box h2 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin: 10px 0;
  outline: none;
}

button {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  background: #00c6ff;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #0072ff;
}

.signup-btn {
  background: #28a745;
}

.signup-btn:hover {
  background: #1e7e34;
}

#msg {
  margin-top: 10px;
  font-size: 14px;
}

.toggle {
  position: absolute;
  right: 15px;
  top: 38px;
  cursor: pointer;
  color: black;
}
</style>

</head>

<body>

<div class="login-box">
  <h2>Welcome Back 👋</h2>

  <div style="position:relative;">
    <input type="text" id="username" placeholder="Enter Username">
  </div>

  <div style="position:relative;">
    <input type="password" id="password" placeholder="Enter Password">
    <span class="toggle" onclick="togglePassword()">👁️</span>
  </div>

  <button onclick="login()">Login</button>
  <button class="signup-btn" onclick="signup()">Sign Up</button>

  <p id="msg"></p>
</div>

<script>

function togglePassword(){
  let pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

function signup(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;
  let msg = document.getElementById("msg");

  if(user === "" || pass === ""){
    msg.innerText = "⚠️ Fill all fields!";
    return;
  }

  localStorage.setItem("user", user);
  localStorage.setItem("pass", pass);

  msg.innerText = "✅ Account Created!";
}

function login(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;
  let msg = document.getElementById("msg");

  let savedUser = localStorage.getItem("user");
  let savedPass = localStorage.getItem("pass");

  if(user === "" || pass === ""){
    msg.innerText = "⚠️ Fill all fields!";
    return;
  }

  if(user === savedUser && pass === savedPass){
    msg.innerText = "✅ Login Successful!";
    setTimeout(() => {
      window.location.href = "pdfs.html";
    }, 1000);
  } else {
    msg.innerText = "❌ Wrong Credentials";
  }
}

</script>

</body>
</html>
