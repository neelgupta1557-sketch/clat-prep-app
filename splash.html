<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CLAT Prep App</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: radial-gradient(circle, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

.container {
    text-align: center;
}

/* LOGO */
.logo {
    font-size: 60px;
    font-weight: bold;
    color: #00ffcc;
    opacity: 0;
    transform: scale(0.5);
    animation: zoomGlow 2s forwards;
}

/* Glow animation */
@keyframes zoomGlow {
    0% {
        opacity: 0;
        transform: scale(0.5);
        text-shadow: none;
    }
    50% {
        opacity: 1;
        transform: scale(1.2);
        text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
    }
    100% {
        transform: scale(1);
        text-shadow: 0 0 10px #00ffcc;
    }
}

/* Typing text */
.typing {
    margin-top: 20px;
    font-size: 28px;
    border-right: 3px solid white;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 2.5s steps(20) forwards, blink 0.7s infinite;
    animation-delay: 1.5s;
}

@keyframes typing {
    from { width: 0 }
    to { width: 260px }
}

@keyframes blink {
    50% { border-color: transparent }
}

/* Subtitle */
.subtitle {
    margin-top: 15px;
    font-size: 16px;
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 3.5s;
}

@keyframes fadeIn {
    to { opacity: 1; }
}
</style>

</head>
<body>

<div class="container">
    <div class="logo">⚖</div>
    <div class="typing">CLAT Prep App</div>
    <div class="subtitle">Made by Neel</div>
</div>

<!-- Sound -->
<audio id="introSound" autoplay>
    <source src="https://www.fesliyanstudios.com/play-mp3/387" type="audio/mpeg">
</audio>

<script>
// Sound play (for mobile support)
window.addEventListener("click", () => {
    document.getElementById("introSound").play();
});

// Redirect after 5 sec
setTimeout(() => {
    window.location.href = "index.html";
}, 5000);
</script>

</body>
</html>
