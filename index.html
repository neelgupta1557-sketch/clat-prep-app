<!DOCTYPE html>
<html>
<head>
  <title>CLAT App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="welcomeUser"></div>
<button onclick="logout()">Logout</button>

<h1>📚 Study Materials</h1>

<!-- 🔍 SEARCH -->
<input type="text" id="search" placeholder="Search..." onkeyup="searchPDF()">

<!-- 🎯 FILTER CATEGORY -->
<div class="category-box">

  <button onclick="displayPDF(pdfData)">🏠 All</button>

  <button onclick="filterCategory('Legal Reasoning')">⚖ Legal Reasoning</button>

  <button onclick="filterCategory('Logical Reasoning')">🧠 Logical Reasoning</button>

  <button onclick="filterCategory('Quantitative Techniques')">➗ Quantitative Techniques</button>

  <button onclick="filterCategory('Previous Year Paper')">📄 Previous Year Paper</button>

  <button onclick="filterCategory('CLAT Mock Test')">📝 CLAT Mock Test</button>

  <button onclick="filterCategory('CLAT Sample Paper')">📘 CLAT Sample Paper</button>

  <button onclick="filterCategory('AILET Mock Test')">🧾 AILET Mock Test</button>

  <button onclick="filterCategory('AILET PYQs')">📑 AILET PYQs</button>

  <button onclick="filterCategory('SLAT Notes')">📒 SLAT Notes</button>

  <button onclick="filterCategory('SLAT Mock Test')">🧪 SLAT Mock Test</button>

  <button onclick="filterCategory('English')">📖 English</button>

  <button onclick="filterCategory('General Knowledge')">🌍 General Knowledge</button>

</div>

<!-- 📚 PDF LIST -->
<div id="pdfList"></div>

<script src="script.js"></script>

</body>
</html>
