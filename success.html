<!DOCTYPE html>
<html>
<head>
<title>Access Granted</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  color: #00ffcc;
  font-family: monospace;
}

/* Matrix rain */
canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* Center text */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* Glow text */
.glow {
  font-size: 30px;
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #00ffcc; }
  to { text-shadow: 0 0 30px #00ffcc; }
}

/* Username background */
.username {
  position: absolute;
  font-size: 80px;
  color: rgba(0,255,200,0.05);
  white-space: nowrap;
  animation: scroll 10s linear infinite;
}

@keyframes scroll {
  0% { transform: translateY(100%); }
  100% { transform: translateY(-100%); }
}
</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div class="username" id="bgName"></div>

<div class="center">
  <div class="glow">💀 ACCESS GRANTED 💀</div>
</div>

<script>

// 🔊 Sound effect
let audio = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
audio.play();

// Username show
let user = localStorage.getItem("user") || "USER";
document.getElementById("bgName").innerText = user;

// Matrix rain effect
let canvas = document.getElementById("matrix");
let ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
letters = letters.split("");

let fontSize = 14;
let columns = canvas.width / fontSize;
let drops = [];

for(let x = 0; x < columns; x++)
  drops[x] = 1;

function draw(){
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#0f0";
  ctx.font = fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++){
    let text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if(drops[i]*fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 33);

// ⏳ Redirect after 3 sec
setTimeout(() => {
  window.location.href = "pdfs.html";
}, 3000);

</script>

</body>
</html>
