<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Success</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }

    .box {
        background: rgba(255,255,255,0.1);
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        animation: fadeIn 1.5s ease;
    }

    .checkmark {
        font-size: 80px;
        color: #00ffcc;
        animation: pop 0.5s ease;
    }

    h1 {
        margin-top: 10px;
    }

    p {
        opacity: 0.8;
    }

    .btn {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 30px;
        background: #00ffcc;
        color: black;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #00ccaa;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(30px);}
        to {opacity: 1; transform: translateY(0);}
    }

    @keyframes pop {
        0% {transform: scale(0);}
        100% {transform: scale(1);}
    }
</style>
</head>
<body>

<div class="box">
    <div class="checkmark">✔</div>
    <h1>Login Successful</h1>
    <p>Welcome back, you are successfully logged in.</p>

    <button class="btn" onclick="goHome()">Go to Home</button>
</div>

<script>
function goHome() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
